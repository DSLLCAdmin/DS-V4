<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" width="200" height="40">
  <defs>
    <style>
      .dark-text { 
        fill: #000000; 
        font-family: 'Directors Gothic', Arial, sans-serif; 
        font-weight: bold; 
        stroke: #FFFFFF; 
        stroke-width: 0.5px;
      }
      .streets-text { 
        fill: #FFFFFF; 
        font-family: 'Directors Gothic', Arial, sans-serif; 
        font-weight: bold; 
        stroke: #000000; 
        stroke-width: 0.5px;
      }
    </style>
  </defs>
  
  <!-- Dark text with white outline -->
  <text x="0" y="28" class="dark-text" font-size="24">Dark</text>
  
  <!-- Streets text with black outline -->
  <text x="70" y="28" class="streets-text" font-size="24">Streets</text>
</svg>
