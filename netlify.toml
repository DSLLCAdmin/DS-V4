[build]
  command = "npm ci && npm run build"
  publish = ".next"  # Enable API routes for serverless functions

[build.environment]
  NODE_VERSION = "18"
  NODE_OPTIONS = "--max-old-space-size=4096"  # Increase memory limit
  NPM_FLAGS = "--prefer-offline --no-audit"   # Faster npm install
  # Exclude docs folder from secrets scanning (documentation only, no actual secrets)
  SECRETS_SCAN_OMIT_PATHS = "docs/**"

# Next.js plugin for proper deployment with API routes
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Next.js handles routing - remove SPA redirect that can cause issues
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/webp"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/png"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/jpeg"
